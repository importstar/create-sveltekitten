name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: dist/ matches src/ (run pnpm build and commit dist/)
        run: git diff --exit-code dist && test -z "$(git ls-files --others --exclude-standard dist)"
      - run: pnpm test

  # A fresh project of every template and mode must install from its own lockfile, pass its
  # own scripts/check.sh (lint, OpenAPI drift in openapi, check, unit tests) and build.
  scaffold:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ssr-fullstack
            flags: --template ssr --mode fullstack
          - variant: ssr-openapi
            flags: --template ssr --mode openapi
          - variant: spa
            flags: --template spa
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            templates/${{ matrix.variant }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Scaffold ${{ matrix.variant }}
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/dist/index.js" --name app ${{ matrix.flags }} --yes
      - name: pnpm install --frozen-lockfile
        working-directory: ${{ runner.temp }}/app
        run: pnpm install --frozen-lockfile
      - name: bash scripts/check.sh
        working-directory: ${{ runner.temp }}/app
        run: bash scripts/check.sh
      - run: pnpm build
        working-directory: ${{ runner.temp }}/app
