name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: dist/ matches src/ (run pnpm build and commit dist/)
        run: git diff --exit-code dist && test -z "$(git ls-files --others --exclude-standard dist)"
      - run: pnpm test

  # A fresh project of every template and mode, with bun and with pnpm, must install from
  # its own lockfile, pass its own scripts/check.sh and build. The CLI job above stays on pnpm.
  # pnpm cells pass --pm pnpm: `node --yes` has no pnpm user agent, so it would pick bun.
  scaffold:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ssr-fullstack
            flags: --template ssr --mode fullstack
            pm: pnpm
          - variant: ssr-fullstack
            flags: --template ssr --mode fullstack
            pm: bun
          - variant: ssr-openapi
            flags: --template ssr --mode openapi
            pm: pnpm
          - variant: ssr-openapi
            flags: --template ssr --mode openapi
            pm: bun
          - variant: spa
            flags: --template spa
            pm: pnpm
          - variant: spa
            flags: --template spa
            pm: bun
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            templates/${{ matrix.variant }}/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        if: matrix.pm == 'bun'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Scaffold ${{ matrix.variant }} (${{ matrix.pm }})
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/dist/index.js" --name app ${{ matrix.flags }} --pm ${{ matrix.pm }} --yes
      - name: pnpm install --frozen-lockfile
        if: matrix.pm == 'pnpm'
        working-directory: ${{ runner.temp }}/app
        run: pnpm install --frozen-lockfile
      - name: bun install --frozen-lockfile
        if: matrix.pm == 'bun'
        working-directory: ${{ runner.temp }}/app
        run: bun install --frozen-lockfile
      - name: bash scripts/check.sh
        working-directory: ${{ runner.temp }}/app
        run: bash scripts/check.sh
      - name: build
        working-directory: ${{ runner.temp }}/app
        run: ${{ matrix.pm == 'bun' && 'bun run build' || 'pnpm build' }}
