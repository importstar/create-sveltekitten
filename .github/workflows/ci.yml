name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: dist/ matches src/ (run pnpm build and commit dist/)
        run: git diff --exit-code dist && test -z "$(git ls-files --others --exclude-standard dist)"
      - run: pnpm test
