name: Bench axis A

on:
  workflow_dispatch:
    inputs:
      cell:
        description: Toolchain cell id, for example T1-ssr-fullstack
        required: true
        type: string
      smoke:
        description: Scaffold, install, and build only
        required: false
        type: boolean
        default: false

jobs:
  cell:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
      - name: Install pinned pnpm and Bun
        run: |
          corepack enable
          corepack prepare pnpm@12.10.1 --activate
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.4"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run one toolchain cell
        env:
          BENCH_SMOKE: ${{ inputs.smoke && '1' || '' }}
        run: bash bench/run.sh "${{ inputs.cell }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ inputs.cell }}
          path: bench/out
          if-no-files-found: ignore
